<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <div class="container">
    <div class="inputs">     
        <input type="text" placeholder="Enter your name" required><br><br>
        <input type="number" placeholder="Mobile number (+123456789123)" required><br><br>
        <textarea name="Message" id="message" placeholder="Enter your message here..." required></textarea>
        <p>Valid Phone No. Must start with a country code (e.g., +123) followed by 9 digits.</p>
    </div>


     <button type="submit"><b>SUBMIT</b></button>
 
    </div>
</body>
</html>
